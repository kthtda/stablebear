name: StatisticalTests

# Runs the large statistical tests (pytest marker `statistical`) on the
# self-hosted runner, so the wheel-test phase stays fast. The marked tests are
# skipped everywhere else unless SB_RUN_STATISTICAL=1 is set.

on:
  workflow_dispatch:
    inputs:
      use_github_runners:
        description: 'Use GitHub-hosted runners instead of self-hosted'
        type: boolean
        default: false
  workflow_call:
    inputs:
      use_github_runners:
        type: boolean
        default: false

jobs:
  statistical:
    name: Statistical tests
    runs-on: ${{ inputs.use_github_runners && 'ubuntu-24.04' || 'self-hosted' }}
    timeout-minutes: ${{ inputs.use_github_runners && 120 || 45 }}
    env:
      BUILD_WITH_CUDA: 0
      SKIP_STUBGEN: 1
      SKIP_BACK_COPY: 1
      # Make pip more tolerant of transient PyPI/network hiccups.
      PIP_RETRIES: 5
      PIP_DEFAULT_TIMEOUT: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up Python (GitHub runner)
        if: inputs.use_github_runners
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      # The runner image provides the Python dependencies, from
      # .github/self-hosted-runner/requirements.txt.
      - name: Set up Python venv (self-hosted)
        if: ${{ !inputs.use_github_runners }}
        run: |
          python3 -m venv --system-site-packages ${{github.workspace}}/.venv
          echo "${{github.workspace}}/.venv/bin" >> $GITHUB_PATH

      - name: Install Python dependencies (GitHub runner)
        if: inputs.use_github_runners
        run: |
          bash .github/scripts/ci-retry.sh python -m pip install --upgrade pip
          bash .github/scripts/ci-retry.sh pip install --group test 'cmake>=3.30.3' numpy tqdm matplotlib

      - name: Configure CMake
        run: |
          cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release \
            -DPython_EXECUTABLE="$(which python3)"

      - name: Build module
        run: cmake --build build -j $(nproc)

      - name: Install module
        run: cmake --install build

      - name: Run statistical tests
        env:
          SB_RUN_STATISTICAL: 1
        run: |
          cd test
          python3 -m pytest python -m statistical -v --durations=0
